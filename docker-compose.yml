services:
  web:
    build: .
    container_name: student_web
    ports:
      - "8089:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: student_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: student_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/student.sql:/docker-entrypoint-initdb.d/student.sql:ro

volumes:
  mysql_data:
